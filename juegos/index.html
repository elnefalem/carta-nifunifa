<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Juegos — Ni Fu, Ni Fa</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header>
        <a href="../index.html" class="volver">← Ni Fu, Ni Fa</a>

        <h1>NI FU, NI FA</h1>
        <p>🎲 JUEGOS</p>
    </header>

    <main>

        <section class="presentacion">
            <h2>Elegí un juego</h2>

            <p>
                Mirá nuestras opciones y descubrí cómo se juega.
            </p>
        </section>

        <section class="filtros-juegos">

    <input
        type="text"
        id="buscador-juegos"
        placeholder="🔎 Buscar un juego..."
    >

    <div class="botones-categorias">
        <button data-categoria="todas">TODOS</button>
        <button data-categoria="cartas">🃏 CARTAS</button>
        <button data-categoria="fiesta">😂 FIESTA</button>
        <button data-categoria="ingenio">🧠 INGENIO</button>
        <button data-categoria="habilidad">🎯 HABILIDAD</button>
        <button data-categoria="clasicos">♟️ CLÁSICOS</button>
        <button data-categoria="mesa">🎲 MESA</button>
        <button data-categoria="palabras">🔤 PALABRAS</button>
    </div>

</section>

        <section id="lista-juegos" class="lista-juegos">
            <!-- Los juegos se generan automáticamente -->
        </section>

    </main>

    <footer>
        <p>🎲 ¿Querés jugar? Pedilo en el mostrador.</p>
    </footer>

    <script src="../js/juegos.js"></script>

</body>

</html>
